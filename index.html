<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Snooker Scorecard</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --felt: #0B4D2E;
    --felt-dark: #073520;
    --cream: #F5EFE0;
    --gold: #C9A961;
    --red: #A6291D;
    --ink: #17231C;
    --line: rgba(245,239,224,0.14);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    background:
      radial-gradient(ellipse at 50% -10%, #0e5c38 0%, var(--felt) 45%, var(--felt-dark) 100%);
    font-family: 'Inter', sans-serif;
    color: var(--cream);
    padding: 20px 14px 60px;
    padding-top: max(20px, env(safe-area-inset-top));
    padding-bottom: max(40px, env(safe-area-inset-bottom));
    padding-left: max(14px, env(safe-area-inset-left));
    padding-right: max(14px, env(safe-area-inset-right));
    overflow-x: hidden;
  }

  button, input {
    touch-action: manipulation;
  }

  .wrap { max-width: 640px; margin: 0 auto; }

  header {
    text-align: center;
    margin-bottom: 22px;
  }

  header h1 {
    font-family: 'Fraunces', serif;
    font-weight: 900;
    font-size: 2.1rem;
    letter-spacing: -0.01em;
    margin: 0;
    color: var(--cream);
  }

  header p {
    margin: 4px 0 0;
    font-size: 0.82rem;
    color: rgba(245,239,224,0.6);
    font-weight: 500;
  }

  /* Setup screen */
  .setup {
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px;
  }
  .setup h2 {
    font-family: 'Fraunces', serif;
    font-size: 1.15rem;
    margin: 0 0 12px;
    font-weight: 700;
  }
  .player-input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }
  .player-input-row input {
    flex: 1;
    background: rgba(0,0,0,0.25);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px 12px;
    color: var(--cream);
    font-size: 16px;
    font-family: 'Inter', sans-serif;
  }
  .player-input-row input::placeholder { color: rgba(245,239,224,0.35); }
  .player-input-row button {
    background: transparent;
    border: 1px solid rgba(166,41,29,0.6);
    color: #e8a9a0;
    border-radius: 8px;
    width: 40px;
    font-size: 1rem;
    cursor: pointer;
  }
  .add-player-btn, .start-btn {
    width: 100%;
    padding: 12px;
    border-radius: 9px;
    border: none;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    margin-top: 6px;
  }
  .add-player-btn {
    background: rgba(201,169,97,0.12);
    color: var(--gold);
    border: 1px dashed rgba(201,169,97,0.5);
  }
  .start-btn {
    background: var(--gold);
    color: var(--felt-dark);
    margin-top: 14px;
  }
  .start-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  /* Scoreboard */
  .players-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px;
    margin-bottom: 16px;
  }

  .player-card {
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 12px;
    text-align: center;
    position: relative;
    transition: background 0.2s ease, transform 0.2s ease;
  }
  .player-card.active {
    background: rgba(201,169,97,0.14);
    border-color: var(--gold);
    transform: translateY(-2px);
  }
  .player-name {
    font-size: 0.78rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: rgba(245,239,224,0.75);
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .player-score {
    font-family: 'Fraunces', serif;
    font-weight: 900;
    font-size: 2.1rem;
    line-height: 1;
    color: var(--cream);
  }
  .player-card.active .player-score { color: var(--gold); }
  .player-break {
    font-size: 0.68rem;
    color: rgba(245,239,224,0.5);
    margin-top: 4px;
    min-height: 14px;
  }
  .player-gap {
    font-size: 0.7rem;
    font-weight: 700;
    margin-top: 3px;
  }
  .player-gap.leader { color: var(--gold); }
  .player-gap.behind { color: rgba(245,239,224,0.55); }
  .turn-tag {
    position: absolute;
    top: -8px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--gold);
    color: var(--felt-dark);
    font-size: 0.6rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 6px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  /* Ball pad */
  .panel {
    background: rgba(0,0,0,0.18);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .panel-title {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: rgba(245,239,224,0.5);
    margin-bottom: 10px;
    font-weight: 600;
  }

  .balls-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
  }

  .ball-btn {
    width: 76px;
    height: 76px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 1.5rem;
    color: white;
    position: relative;
    box-shadow: inset -5px -6px 10px rgba(0,0,0,0.35), inset 4px 5px 7px rgba(255,255,255,0.25), 0 4px 10px rgba(0,0,0,0.45);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .ball-btn:hover {
    transform: translateY(-3px) scale(1.06);
    box-shadow: inset -5px -6px 10px rgba(0,0,0,0.35), inset 4px 5px 7px rgba(255,255,255,0.25), 0 8px 16px rgba(0,0,0,0.5), 0 0 0 4px rgba(201,169,97,0.55);
  }
  .ball-btn:focus-visible {
    outline: none;
    box-shadow: inset -5px -6px 10px rgba(0,0,0,0.35), inset 4px 5px 7px rgba(255,255,255,0.25), 0 0 0 4px rgba(201,169,97,0.8);
  }
  .ball-btn:active { transform: scale(0.9); }

  .ball-red    { background: #B22016; }
  .ball-yellow { background: #E8B923; color: #3a2c00; }
  .ball-green  { background: #157A3E; }
  .ball-brown  { background: #6B4226; }
  .ball-blue   { background: #1E5FA8; }
  .ball-pink   { background: #D9718C; }
  .ball-black  { background: #171717; }

  .action-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
  }
  .action-btn {
    flex: 1;
    min-width: 100px;
    padding: 12px 8px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: rgba(255,255,255,0.04);
    color: var(--cream);
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 0.82rem;
    cursor: pointer;
  }
  .action-btn:hover { background: rgba(255,255,255,0.09); }
  .action-btn.foul { color: #e8a9a0; border-color: rgba(166,41,29,0.5); }
  .action-btn.undo { color: var(--gold); }

  .foul-panel {
    display: none;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--line);
  }
  .foul-panel.open { display: block; }
  .foul-vals {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .foul-val-btn {
    flex: 1;
    min-width: 44px;
    padding: 8px 0;
    border-radius: 7px;
    border: 1px solid rgba(166,41,29,0.5);
    background: rgba(166,41,29,0.12);
    color: #e8a9a0;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
  }

  .remove-red-check {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    font-size: 0.78rem;
    color: rgba(245,239,224,0.7);
    cursor: pointer;
  }
  .remove-red-check input {
    width: 16px;
    height: 16px;
    accent-color: var(--red);
    cursor: pointer;
  }

  /* Frame controls */
  .frame-bar {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
    font-size: 0.82rem;
    color: rgba(245,239,224,0.65);
  }
  .frame-bar button {
    background: none;
    border: 1px solid var(--line);
    color: var(--cream);
    padding: 7px 12px;
    border-radius: 8px;
    font-size: 0.78rem;
    cursor: pointer;
  }

  .points-left-bar {
    text-align: center;
    font-size: 0.76rem;
    color: rgba(245,239,224,0.6);
    background: rgba(0,0,0,0.15);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 8px 10px;
    margin-bottom: 14px;
  }
  .points-left-bar strong { color: var(--gold); }

  /* History */
  .history-toggle {
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    color: rgba(245,239,224,0.6);
    font-family: 'Inter', sans-serif;
    font-size: 0.82rem;
    font-weight: 600;
    padding: 10px 2px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid var(--line);
  }
  .history-list {
    display: none;
    max-height: 280px;
    overflow-y: auto;
    padding: 6px 2px 0;
  }
  .history-list.open { display: block; }
  .history-entry {
    display: flex;
    justify-content: space-between;
    font-size: 0.78rem;
    padding: 7px 4px;
    border-bottom: 1px solid rgba(245,239,224,0.06);
    color: rgba(245,239,224,0.8);
  }
  .history-entry .points { font-weight: 700; }
  .history-entry .points.pos { color: #9BD8A9; }
  .history-entry .points.neg { color: #e8a9a0; }
  .history-empty {
    text-align: center;
    padding: 16px;
    font-size: 0.78rem;
    color: rgba(245,239,224,0.4);
  }

  .match-frames {
    text-align: center;
    font-size: 0.72rem;
    color: rgba(245,239,224,0.5);
    margin-bottom: 6px;
  }

  .hidden { display: none !important; }

  /* Toast */
  #toastWrap {
    position: fixed;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 50;
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: center;
    pointer-events: none;
  }
  .toast {
    background: linear-gradient(135deg, #C9302C, #8f1f1c);
    color: #fff2ee;
    padding: 10px 18px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 0.85rem;
    box-shadow: 0 8px 22px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.08) inset;
    animation: toastIn 0.35s cubic-bezier(.2,1.4,.4,1), toastOut 0.35s ease-in 1.85s forwards;
    white-space: nowrap;
  }
  .toast.pot {
    background: linear-gradient(135deg, #1e8f52, #0d5230);
  }
  @keyframes toastIn {
    from { opacity: 0; transform: translateY(-16px) scale(0.9); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes toastOut {
    from { opacity: 1; }
    to   { opacity: 0; transform: translateY(-10px) scale(0.95); }
  }

  /* Score pop */
  @keyframes scorePop {
    0%   { transform: scale(1); }
    35%  { transform: scale(1.32); }
    100% { transform: scale(1); }
  }
  .player-score.pop { animation: scorePop 0.45s cubic-bezier(.2,1.6,.4,1); }

  @keyframes cardGlow {
    0%   { box-shadow: 0 0 0 0 rgba(201,169,97,0); }
    30%  { box-shadow: 0 0 0 6px rgba(201,169,97,0.35); }
    100% { box-shadow: 0 0 0 0 rgba(201,169,97,0); }
  }
  .player-card.glow { animation: cardGlow 0.7s ease-out; }

  .player-card.foul-hit { border-color: #C9302C; }
  .player-card.foul-hit .player-score { color: #ff9d8f; }

  @keyframes foulPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(201,48,44,0.5); }
    50%      { box-shadow: 0 0 0 5px rgba(201,48,44,0.18); }
  }
  .action-btn.foul.open-pulse { animation: foulPulse 1.4s ease-in-out infinite; }

  /* Phone tuning */
  @media (max-width: 480px) {
    body { padding-left: max(10px, env(safe-area-inset-left)); padding-right: max(10px, env(safe-area-inset-right)); }
    header h1 { font-size: 1.7rem; }
    header p { font-size: 0.76rem; }
    .panel { padding: 12px; }
    .ball-btn {
      width: 58px;
      height: 58px;
      font-size: 1.15rem;
    }
    .balls-row { gap: 8px; }
    .action-btn { min-width: 42%; font-size: 0.78rem; padding: 11px 6px; }
    .player-score { font-size: 1.75rem; }
    .players-grid { grid-template-columns: repeat(auto-fit, minmax(105px, 1fr)); gap: 8px; }
    .player-card { padding: 12px 8px; }
    .frame-bar { font-size: 0.74rem; }
    .frame-bar button { padding: 8px 10px; font-size: 0.72rem; }
    .toast { font-size: 0.76rem; padding: 9px 14px; white-space: normal; text-align: center; max-width: 88vw; }
    .points-left-bar { font-size: 0.7rem; }
    .history-entry { font-size: 0.73rem; }
  }

  @media (max-width: 340px) {
    .ball-btn { width: 50px; height: 50px; font-size: 1rem; }
    .action-btn { min-width: 100%; }
  }
</style>
</head>
<body>
<div id="toastWrap"></div>
<div class="wrap">
  <header>
    <h1>Snooker Scorecard</h1>
    <p id="subtitle">Set up your players to start the frame</p>
  </header>

  <!-- SETUP SCREEN -->
  <div class="setup" id="setupScreen">
    <h2>Players</h2>
    <div id="playerInputs"></div>
    <button class="add-player-btn" id="addPlayerBtn">+ Add player</button>
    <button class="start-btn" id="startBtn">Start frame</button>
  </div>

  <!-- GAME SCREEN -->
  <div id="gameScreen" class="hidden">
    <div class="frame-bar">
      <span id="frameLabel">Frame 1</span>
      <span id="redsLabel">Reds on table: 15</span>
      <div style="display:flex; gap:8px;">
        <button id="newFrameBtn">New frame</button>
        <button id="resetBtn">Reset match</button>
      </div>
    </div>
    <div class="points-left-bar" id="pointsLeftBar"></div>

    <div class="players-grid" id="playersGrid"></div>

    <div class="panel">
      <div class="panel-title">Pot a ball for the player on the table</div>
      <div class="balls-row">
        <button class="ball-btn ball-red" data-points="1">1</button>
        <button class="ball-btn ball-yellow" data-points="2">2</button>
        <button class="ball-btn ball-green" data-points="3">3</button>
        <button class="ball-btn ball-brown" data-points="4">4</button>
        <button class="ball-btn ball-blue" data-points="5">5</button>
        <button class="ball-btn ball-pink" data-points="6">6</button>
        <button class="ball-btn ball-black" data-points="7">7</button>
      </div>
      <div class="action-row">
        <button class="action-btn undo" id="undoBtn">↺ Undo last</button>
        <button class="action-btn" id="endTurnBtn">End turn / Switch</button>
        <button class="action-btn foul" id="foulBtn">Foul</button>
      </div>
      <div class="action-row">
        <button class="action-btn foul" id="removeRedBtn">● Remove a red (no penalty)</button>
      </div>
      <div class="foul-panel" id="foulPanel">
        <div class="panel-title" id="foulPanelTitle">Foul points awarded to opponent (next player)</div>
        <div class="foul-vals">
          <button class="foul-val-btn" data-foul="4">4</button>
          <button class="foul-val-btn" data-foul="5">5</button>
          <button class="foul-val-btn" data-foul="6">6</button>
          <button class="foul-val-btn" data-foul="7">7</button>
        </div>
        <label class="remove-red-check">
          <input type="checkbox" id="removeRedCheck" />
          Red was potted illegally — remove it from the table too
        </label>
      </div>
    </div>

    <button class="history-toggle" id="historyToggle">
      <span>Match history</span>
      <span id="historyChevron">▾</span>
    </button>
    <div class="history-list" id="historyList"></div>
  </div>
</div>

<script>
(function(){
  const STORAGE_KEY = 'snooker-match-state';
  let state = null;

  const setupScreen = document.getElementById('setupScreen');
  const gameScreen = document.getElementById('gameScreen');
  const playerInputs = document.getElementById('playerInputs');
  const addPlayerBtn = document.getElementById('addPlayerBtn');
  const startBtn = document.getElementById('startBtn');
  const playersGrid = document.getElementById('playersGrid');
  const frameLabel = document.getElementById('frameLabel');
  const subtitle = document.getElementById('subtitle');
  const foulPanel = document.getElementById('foulPanel');
  const historyList = document.getElementById('historyList');
  const historyToggle = document.getElementById('historyToggle');
  const historyChevron = document.getElementById('historyChevron');

  function defaultState(){
    return {
      players: [],       // [{id, name, score, frameWins, currentBreak}]
      currentIdx: 0,
      frame: 1,
      redsRemaining: 15,
      history: []         // [{frame, playerName, type, points, resultingScore, time}]
    };
  }

  async function loadState(){
    try {
      const res = await window.storage.get('match-state', false);
      if (res && res.value) {
        state = JSON.parse(res.value);
        if (state.redsRemaining === undefined) state.redsRemaining = 15;
      } else {
        state = defaultState();
      }
    } catch(e) {
      state = defaultState();
    }
    render();
  }

  async function saveState(){
    try {
      await window.storage.set('match-state', JSON.stringify(state), false);
    } catch(e) {
      console.error('Save failed', e);
    }
  }

  function uid(){ return 'p' + Math.random().toString(36).slice(2,9); }

  function showToast(msg, kind){
    const wrap = document.getElementById('toastWrap');
    const el = document.createElement('div');
    el.className = 'toast' + (kind ? ' ' + kind : '');
    el.textContent = msg;
    wrap.appendChild(el);
    setTimeout(() => el.remove(), 2200);
  }

  let flashPlayerIds = [];
  let flashKind = null; // 'pop' or 'glow'

  function renderSetupInputs(names){
    playerInputs.innerHTML = '';
    names.forEach((n, i) => {
      const row = document.createElement('div');
      row.className = 'player-input-row';
      row.innerHTML = `
        <input type="text" placeholder="Player ${i+1} name" value="${n || ''}" data-idx="${i}" />
        ${names.length > 2 ? '<button data-remove="'+i+'">×</button>' : ''}
      `;
      playerInputs.appendChild(row);
    });
  }

  let setupNames = ['', ''];

  function refreshSetup(){
    renderSetupInputs(setupNames);
    playerInputs.querySelectorAll('input').forEach(inp => {
      inp.addEventListener('input', e => {
        setupNames[+e.target.dataset.idx] = e.target.value;
      });
    });
    playerInputs.querySelectorAll('[data-remove]').forEach(btn => {
      btn.addEventListener('click', e => {
        setupNames.splice(+e.target.dataset.remove, 1);
        refreshSetup();
      });
    });
  }

  addPlayerBtn.addEventListener('click', () => {
    if (setupNames.length >= 8) return;
    setupNames.push('');
    refreshSetup();
  });

  startBtn.addEventListener('click', () => {
    const valid = setupNames.map(n => n.trim()).filter(Boolean);
    if (valid.length < 2) return;
    state = defaultState();
    state.players = valid.map(name => ({
      id: uid(), name, score: 0, frameWins: 0, currentBreak: 0
    }));
    saveState();
    render();
  });

  function currentPlayer(){
    return state.players[state.currentIdx];
  }

  function addHistory(entry){
    state.history.unshift(Object.assign({
      frame: state.frame,
      time: new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})
    }, entry));
  }

  function pot(points){
    const p = currentPlayer();
    p.score += points;
    p.currentBreak += points;
    addHistory({ playerName: p.name, type: 'pot', points: points });
    flashPlayerIds = [p.id];
    flashKind = 'pop';
    if (p.currentBreak >= 20 && p.currentBreak - points < 20) {
      showToast(p.name + ' is on a break of ' + p.currentBreak + '! 🎱', 'pot');
    }
    saveState();
    render();
  }

  function foul(points){
    const fouler = currentPlayer();
    fouler.currentBreak = 0;
    const removeRed = document.getElementById('removeRedCheck').checked;
    let redRemoved = false;
    if (removeRed && state.redsRemaining > 0) {
      state.redsRemaining -= 1;
      redRemoved = true;
    }

    let nextIdx;
    if (state.players.length > 2) {
      // Award foul points to every other player on the table
      const others = state.players.filter(p => p.id !== fouler.id);
      others.forEach(p => p.score += points);
      const names = others.map(p => p.name).join(', ');
      addHistory({ playerName: names, type: 'foul (' + fouler.name + ')', points: points, redRemoved: redRemoved, allPlayers: true });
      nextIdx = (state.currentIdx + 1) % state.players.length;
      flashPlayerIds = others.map(p => p.id);
      showToast('Foul! +' + points + ' to everyone else', 'foul');
    } else {
      nextIdx = (state.currentIdx + 1) % state.players.length;
      const opponent = state.players[nextIdx];
      opponent.score += points;
      addHistory({ playerName: opponent.name, type: 'foul (' + fouler.name + ')', points: points, redRemoved: redRemoved });
      flashPlayerIds = [opponent.id];
      showToast('Foul! +' + points + ' to ' + opponent.name, 'foul');
    }
    flashKind = 'foul-hit';

    state.currentIdx = nextIdx;
    foulPanel.classList.remove('open');
    document.getElementById('foulBtn').classList.remove('open-pulse');
    document.getElementById('removeRedCheck').checked = false;
    saveState();
    render();
  }

  function removeRedOnly(){
    if (state.redsRemaining <= 0) return;
    state.redsRemaining -= 1;
    addHistory({ playerName: currentPlayer().name, type: 'red removed', points: 0 });
    saveState();
    render();
  }

  function endTurn(){
    const p = currentPlayer();
    if (p.currentBreak > 0) {
      addHistory({ playerName: p.name, type: 'break ended', points: 0, note: p.currentBreak });
    }
    p.currentBreak = 0;
    state.currentIdx = (state.currentIdx + 1) % state.players.length;
    saveState();
    render();
  }

  function undo(){
    if (state.history.length === 0) return;
    const last = state.history[0];
    // find the player it affected and reverse
    if (last.allPlayers) {
      const fouler = state.players.find(pl => 'foul (' + pl.name + ')' === last.type);
      state.players.forEach(p => {
        if (!fouler || p.id !== fouler.id) p.score -= last.points;
      });
    } else {
      const player = state.players.find(pl => pl.name === last.playerName);
      if (player && (last.type === 'pot' || last.type.startsWith('foul'))) {
        player.score -= last.points;
        if (last.type === 'pot') player.currentBreak = Math.max(0, player.currentBreak - last.points);
      }
    }
    if (last.type.startsWith('foul') && last.redRemoved) {
      state.redsRemaining = Math.min(15, state.redsRemaining + 1);
    }
    if (last.type === 'red removed') {
      state.redsRemaining = Math.min(15, state.redsRemaining + 1);
    }
    state.history.shift();
    saveState();
    render();
  }

  function newFrame(){
    // determine winner of current frame by highest score
    let winner = state.players[0];
    state.players.forEach(p => { if (p.score > winner.score) winner = p; });
    winner.frameWins += 1;
    addHistory({ playerName: winner.name, type: 'frame won', points: 0 });
    state.players.forEach(p => { p.score = 0; p.currentBreak = 0; });
    state.frame += 1;
    state.currentIdx = 0;
    state.redsRemaining = 15;
    saveState();
    render();
  }

  function resetMatch(){
    state = defaultState();
    setupNames = ['', ''];
    saveState();
    render();
  }

  function render(){
    if (!state || state.players.length === 0) {
      setupScreen.classList.remove('hidden');
      gameScreen.classList.add('hidden');
      refreshSetup();
      subtitle.textContent = 'Set up your players to start the frame';
      return;
    }
    setupScreen.classList.add('hidden');
    gameScreen.classList.remove('hidden');
    subtitle.textContent = state.players.map(p => p.name).join(' vs ');
    frameLabel.textContent = 'Frame ' + state.frame;
    document.getElementById('redsLabel').textContent = 'Reds on table: ' + (state.redsRemaining ?? 15);
    document.getElementById('foulPanelTitle').textContent = state.players.length > 2
      ? 'Foul points awarded to every other player'
      : 'Foul points awarded to opponent (next player)';

    playersGrid.innerHTML = '';
    const maxScore = Math.max(...state.players.map(p => p.score));
    const leadersCount = state.players.filter(p => p.score === maxScore).length;
    state.players.forEach((p, idx) => {
      const card = document.createElement('div');
      const isFlashed = flashPlayerIds.includes(p.id);
      let extraClass = '';
      if (isFlashed && flashKind === 'foul-hit') extraClass = ' glow foul-hit';
      else if (isFlashed && flashKind === 'pop') extraClass = ' glow';
      card.className = 'player-card' + (idx === state.currentIdx ? ' active' : '') + extraClass;
      const isLeader = p.score === maxScore && maxScore > 0;
      const tied = isLeader && leadersCount > 1;
      let gapHtml;
      if (maxScore === 0) gapHtml = '';
      else if (isLeader) gapHtml = `<div class="player-gap leader">${tied ? 'Tied lead' : '👑 Leader'}</div>`;
      else gapHtml = `<div class="player-gap behind">−${maxScore - p.score} behind</div>`;
      card.innerHTML = `
        ${idx === state.currentIdx ? '<div class="turn-tag">On table</div>' : ''}
        <div class="player-name">${escapeHtml(p.name)}</div>
        <div class="player-score${isFlashed && flashKind === 'pop' ? ' pop' : ''}">${p.score}</div>
        ${gapHtml}
        <div class="player-break">${p.currentBreak > 0 ? 'Break: ' + p.currentBreak : (p.frameWins ? 'Frames: ' + p.frameWins : '')}</div>
      `;
      card.addEventListener('click', () => {
        state.currentIdx = idx;
        saveState();
        render();
      });
      playersGrid.appendChild(card);
      if (isFlashed) {
        setTimeout(() => {
          card.classList.remove('glow', 'foul-hit');
          const scoreEl = card.querySelector('.player-score');
          if (scoreEl) scoreEl.classList.remove('pop');
        }, 1600);
      }
    });
    flashPlayerIds = [];
    flashKind = null;

    renderPointsLeft(maxScore);
    renderHistory();
  }

  function renderPointsLeft(maxScore){
    const el = document.getElementById('pointsLeftBar');
    if (!el) return;
    const reds = state.redsRemaining ?? 15;
    const pointsLeft = reds * 8 + 27; // max possible: each red+black (8) plus final colour sequence (27)
    const trailing = state.players.filter(p => p.score < maxScore);
    const cannotWin = trailing.filter(p => (maxScore - p.score) > pointsLeft).map(p => p.name);
    let msg = `Points still on table: <strong>${pointsLeft}</strong>`;
    if (cannotWin.length > 0) {
      msg += ` · ${escapeHtml(cannotWin.join(', '))} can no longer win outright — needs snookers`;
    }
    el.innerHTML = msg;
  }

  function renderHistory(){
    if (state.history.length === 0) {
      historyList.innerHTML = '<div class="history-empty">No shots yet — pot a ball to begin.</div>';
      return;
    }
    historyList.innerHTML = state.history.map(h => {
      const cls = h.type === 'pot' ? 'pos' : (h.type.startsWith('foul') ? 'pos' : '');
      let label;
      if (h.type === 'pot') label = `${escapeHtml(h.playerName)} potted (+${h.points})`;
      else if (h.type.startsWith('foul')) {
        if (h.allPlayers) {
          label = `${escapeHtml(h.type.replace('foul','Foul by'))} → +${h.points} to everyone else (${escapeHtml(h.playerName)})`;
        } else {
          label = `${escapeHtml(h.type.replace('foul','Foul by'))} → +${h.points} to ${escapeHtml(h.playerName)}`;
        }
        if (h.redRemoved) label += ' · red removed';
      }
      else if (h.type === 'break ended') label = `${escapeHtml(h.playerName)} ended break of ${h.note}`;
      else if (h.type === 'red removed') label = `Red removed from table (foul)`;
      else if (h.type === 'frame won') label = `🏆 ${escapeHtml(h.playerName)} won frame ${h.frame}`;
      else label = escapeHtml(h.playerName) + ' ' + h.type;
      const pts = h.points > 0 ? `<span class="points pos">+${h.points}</span>` : '';
      return `<div class="history-entry"><span>[F${h.frame} · ${h.time}] ${label}</span>${pts}</div>`;
    }).join('');
  }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // Event bindings
  document.querySelectorAll('.ball-btn').forEach(btn => {
    btn.addEventListener('click', () => pot(parseInt(btn.dataset.points, 10)));
  });
  document.querySelectorAll('.foul-val-btn').forEach(btn => {
    btn.addEventListener('click', () => foul(parseInt(btn.dataset.foul, 10)));
  });
  document.getElementById('foulBtn').addEventListener('click', () => {
    foulPanel.classList.toggle('open');
    document.getElementById('foulBtn').classList.toggle('open-pulse', foulPanel.classList.contains('open'));
  });
  document.getElementById('removeRedBtn').addEventListener('click', removeRedOnly);
  document.getElementById('endTurnBtn').addEventListener('click', endTurn);
  document.getElementById('undoBtn').addEventListener('click', undo);
  document.getElementById('newFrameBtn').addEventListener('click', newFrame);
  document.getElementById('resetBtn').addEventListener('click', () => {
    if (confirm('Reset the whole match? This clears scores, frames, and history.')) resetMatch();
  });
  historyToggle.addEventListener('click', () => {
    historyList.classList.toggle('open');
    historyChevron.textContent = historyList.classList.contains('open') ? '▴' : '▾';
  });

  refreshSetup();
  loadState();
})();
</script>
</body>
</html>
